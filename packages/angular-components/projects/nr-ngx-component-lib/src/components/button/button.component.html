@if ( !isAnchor ) {
    <button
        matRipple
        [disabled]="disabled"
        [matTooltip]="tooltipVal"
    >
        @if ( useContent ) {
            <div class="content">
                <ng-content></ng-content>
            </div>
        }
        @else {
            @if ( hasIconLeft ) {
                <nrcl-icon class="left" [small]="isIconSmall">{{ icon }}</nrcl-icon>
            }

            @if ( hasIconRight ) {
                <nrcl-icon class="right" [small]="isIconSmall">{{ iconRight }}</nrcl-icon>
            }

            @if ( hasIconCompact ) {
                <nrcl-icon class="compact" [small]="isIconSmall">{{ iconCompact || icon }}</nrcl-icon>
            }

            @if ( hasLabel ) {
                <span class="label">{{ label }}</span>
            }
        }
    </button>
}
@else {
    <a 
        [attr.href]="href" 
        [attr.target]="href && target"
        [matTooltip]="tooltipVal"
    >
        @if ( hasIconLeft ) {
            <nrcl-icon class="left" [small]="isIconSmall">{{ icon }}</nrcl-icon>
        }

        @if ( hasIconRight ) {
            <nrcl-icon class="right" [small]="isIconSmall">{{ iconRight }}</nrcl-icon>
        }

        @if ( hasIconCompact ) {
            <nrcl-icon class="compact" [small]="isIconSmall">{{ iconCompact || icon }}</nrcl-icon>
        }

        @if ( hasLabel ) {
            <span class="label">{{ label }}</span>
        }
    </a>
}
