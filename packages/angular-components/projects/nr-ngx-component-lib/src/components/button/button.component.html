<button 
    matRipple
    [disabled]="disabled"
    [matTooltip]="tooltip"
>
    @if ( useContent ) {
        <div class="content">
            <ng-content></ng-content>
        </div>
    }
    @else {
        @if ( hasIconLeft ) { 
            <nrcl-icon [small]="small" class="left">{{ icon }}</nrcl-icon> 
        }

        @if ( hasIconRight ) { 
            <nrcl-icon [small]="small" class="right">{{ iconRight }}</nrcl-icon> 
        }

        @if ( hasIconCompact ) { 
            <nrcl-icon class="compact">{{ iconCompact || icon }}</nrcl-icon> 
        }

        @if ( hasLabel ) {
            <span class="label">{{ label }}</span>        
        }
    }
</button>
