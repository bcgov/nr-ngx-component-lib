<header role="banner">
    <div class="logo-title">
        <div class="logo"
            role="button"
            tabindex="0"
            [attr.aria-label]="logoAriaLabel"
            (click)="onClickLogo()"
            (keydown)="onKeyDownLogo($event)"
        ></div>


        @if ( skipLabel ) {
            <div class="skip"
                role="button"
                tabindex="0"
                (click)="onClickSkip()"
                (keydown)="onKeyDownSkip($event)"
            >
                {{ skipLabel }}
            </div>
        }

        <div class="divider"></div>

        <h1 class="title">
            {{ title }}
        </h1>
    </div>

    <ng-content select="nrcl-menu"></ng-content>
</header>
