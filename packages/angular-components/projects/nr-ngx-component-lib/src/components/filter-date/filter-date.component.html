<mat-form-field
    floatLabel="auto"
    appearance="outline"
    subscriptSizing="dynamic"
>
    <mat-label>{{ label }}</mat-label>

    <input matInput class="search-input" readonly
        [ngModel]="value"
        (ngModelChange)="onDateChange( $event )"
        [placeholder]="placeholder"
        maxlength="10"
        (click)="onInputFocus()"
        [matDatepicker]="picker"
    >

    @if ( hint ) {
        <mat-hint>{{ hint }}</mat-hint>
    }

    <mat-datepicker #picker
        (opened)="onDatepickerOpened( $event )"
    ></mat-datepicker>
</mat-form-field>

@if ( isOpen || !hasValue || !clear ) {
    <nrcl-button tertiary
        icon="event"
        (click)="picker.open()"
    ></nrcl-button>
}
@else {
    <nrcl-button tertiary
        icon="close"
        (click)="onCancelClick()"
    ></nrcl-button>
}
