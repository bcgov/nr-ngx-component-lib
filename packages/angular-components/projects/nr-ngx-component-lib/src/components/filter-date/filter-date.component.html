<mat-form-field
    floatLabel="auto"
    appearance="outline"
    subscriptSizing="dynamic"
>
    <mat-label>{{ label }}</mat-label>

    <input matInput class="search-input"            
        [ngModel]="value" 
        (ngModelChange)="onDateChange( $event )"
        [placeholder]="placeholder"
        [owlDateTime]="selectedDateDT" 
        maxlength="10" 
        appWFDateMask
    >

    @if ( hint ) {
        <mat-hint>{{ hint }}</mat-hint>
    }

    <nrcl-button tertiary matSuffix
        icon="event"
        [owlDateTimeTrigger]="selectedDateDT" 
    ></nrcl-button>
</mat-form-field>

<owl-date-time #selectedDateDT pickerType="calendar"></owl-date-time>
