<mat-form-field
    floatLabel="auto"
    appearance="outline"
    subscriptSizing="dynamic"
>
    <mat-label>{{ label }}</mat-label>

    <input matInput class="search-input"            
        [ngModel]="value" 
        (ngModelChange)="onDateChange( $event )"
        [placeholder]="placeholder"
        maxlength="10" 
        appWFDateMask
    >

    @if ( hint ) {
        <mat-hint>{{ hint }}</mat-hint>
    }
</mat-form-field>

<nrcl-button tertiary
    icon="event"
></nrcl-button>
