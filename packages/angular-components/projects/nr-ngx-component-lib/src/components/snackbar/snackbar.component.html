<div class="icon">
    @switch ( config.type ) {
        @case ( 'success' ) {
            <nrcl-icon>check_circle</nrcl-icon>
        }
        @case ( 'error' ) {
            <nrcl-icon>cancel</nrcl-icon>
        }
        @case ( 'info' ) {
            <nrcl-icon>info</nrcl-icon>
        }
        @case ( 'update' ) {
            <nrcl-icon>error</nrcl-icon>
        }
    }
</div>

<div class="message">
    <span>{{ config.message }}</span>
</div>

<div class="button">
    <button (click)="snackBarRef.dismissWithAction()">Close</button>
</div>
