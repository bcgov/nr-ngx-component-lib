<div class="icon">
    @switch ( config.type ) {
        @case ( 'success' ) {
            <nrcl-icon large>check_circle</nrcl-icon>
        }
        @case ( 'error' ) {
            <nrcl-icon large>cancel</nrcl-icon>
        }
        @case ( 'info' ) {
            <nrcl-icon large>info</nrcl-icon>
        }
        @case ( 'update' ) {
            <nrcl-icon large>error</nrcl-icon>
        }
    }
</div>

<div class="message">
    <span>{{ config.message }}</span>
</div>

<div class="button">
    <!-- <button (click)="snackBarRef.dismissWithAction()">Close</button> -->
    <!-- <nrcl-button 
        label="Close"
        (click)="snackBarRef.dismissWithAction()"
    ></nrcl-button> -->
    <nrcl-button tertiary
        icon="close"
        (click)="snackBarRef.dismissWithAction()"
    ></nrcl-button>
</div>
