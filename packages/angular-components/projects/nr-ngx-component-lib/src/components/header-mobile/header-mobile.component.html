@if (skipLinksEnabled) {
    <a
        class="skip-link"
        [href]="'#' + skipLinkTarget"
    >
        {{ skipLinkLabel }}
    </a>
}

<header
    class="bcds-header-mobile"
    role="banner"
>
    <div class="bcds-header-mobile--container">

        <a
            class="logo-link"
            [attr.href]="homeUrl"
            aria-label="BC Wildfire Service home"
        >
        <img class="bcgov-logo"
            src="assets/BCWS_H1_rgb_pos.png"
            alt="BC Wildfire Service logo">
        </a>

        <h1 class="bcds-header-mobile--title">
            {{ siteTitle }}
        </h1>

        <div class="header-mobile-actions">
            <ng-content select="[action]"></ng-content>
        </div>

    </div>
</header>
