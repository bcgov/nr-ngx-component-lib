<nrcl-button secondary #menuTrigger                
    [label]="desktopVisible && label"
    [ariaLabel]="label || 'Menu'"
    [icon]="icon"
    [matMenuTriggerFor]="menu"
></nrcl-button>

<mat-menu #menu="matMenu"
    class="nrcl-application-menu"
>
    @for ( item of items; track item.label ) {
            <button mat-menu-item class="nrcl-application-menu-item"
                (click)="onClickItem( item )"
            >
            <nrcl-icon>{{ item.icon || 'empty' }}</nrcl-icon>
            <span class="label">{{ item.label }}</span>                        
        </button>
    }                
</mat-menu>
