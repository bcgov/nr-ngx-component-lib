@if (skipLinksEnabled) {

    <a
        class="skip-link"
        [href]="'#' + skipLinkTarget"
    >
        Skip to main content
    </a>

    <a
        class="skip-link"
        [attr.href]="homeUrl"
    >
        Skip to home
    </a>
}
<header
    class="bcds-header-desktop"
    role="banner"
>
    <div class="bcds-header-desktop--container">

        <div class="header-desktop-brand">

            <a
                class="logo-link"
                [routerLink]="homeUrl"
                aria-label="BC Wildfire Service home"
            >
            <img class="bcgov-logo"
                src="assets/BCWS_H1_rgb_pos.png">
                 
            </a>

            <div class="bcds-header-desktop--line"></div>

            <h1 class="bcds-header-desktop--title">
                {{ siteTitle }}
            </h1>

        </div>

        <div class="header-desktop-actions">
            <ng-content select="[action]"></ng-content>
        </div>

    </div>
</header>
