<ng-template #action>
    <ng-content select="nrcl-button"></ng-content>
</ng-template>

@if ( items?.length > 0 ) {
    <mat-chip-set>
        <ng-container [ngTemplateOutlet]="action"></ng-container>

        @for ( item of items; track item.id ) {
            <mat-chip
                (removed)="onRemoveItem( item.id )"
                [matTooltip]="item.tooltip"
            >
                @if ( item.icon ) {
                    <nrcl-icon small matChipAvatar>{{ item.icon }}</nrcl-icon>
                }

                {{ item.description }}

                @if ( removable ) {
                    <nrcl-icon small matChipRemove>cancel</nrcl-icon>
                }
            </mat-chip>
        }
    </mat-chip-set>
} 
@else {
    <div class="no-tags">
        <span>{{ noItemsMessage }}</span>
        <ng-container [ngTemplateOutlet]="action"></ng-container>
    </div>
}
