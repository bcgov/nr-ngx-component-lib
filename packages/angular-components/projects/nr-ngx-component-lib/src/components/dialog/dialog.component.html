<div mat-dialog-title >
    <div class="title-bar">
        <ng-content select="section[header]">
            <h1>{{ title }}</h1>

            <div style="flex: 1 0"></div>

            @if ( isLoading ) {
                <div class="spinner-header">
                    <mat-spinner [diameter]="25"></mat-spinner>
                </div>
            }

            @if ( showClose ) {
                <nrcl-button tertiary class="close"
                    icon="close"
                    ariaLabel="Close dialog"
                    (click)="cancelClick.emit()"
                ></nrcl-button>                                
            }
        </ng-content>
    </div>

    <ng-content select="section[title]"></ng-content>
</div>

<div mat-dialog-content>
    <div class="content-wrapper">
        <ng-content></ng-content>
    </div>
</div>

<ng-content select="section[footer]"></ng-content>

@if ( showActions ) {
    <div mat-dialog-actions align="end">
        <div class="action-button-wrapper">        
            <ng-content select="section[actions]">
                @if ( saveEnabled && showWarning ) {
                    <div class="warning">
                        <nrcl-icon attr.alt="Unsaved Changes">warning</nrcl-icon>
                        <span>Unsaved Changes</span>
                    </div>
                }            
                
                @if ( cancelEnabled != null ) {
                    <nrcl-button 
                        [label]="cancelLabel"
                        (click)="cancelClick.emit()"
                        [disabled]="!cancelEnabled"
                    ></nrcl-button>
                }

                @if ( saveEnabled != null ) {
                    <nrcl-button primary
                        [label]="saveLabel"
                        (click)="saveClick.emit()" 
                        [disabled]="!saveEnabled"
                    ></nrcl-button>
                }
            </ng-content>
        </div>
    </div>
}
