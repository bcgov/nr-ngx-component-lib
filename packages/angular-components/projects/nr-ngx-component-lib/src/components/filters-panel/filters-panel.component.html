@if ( showFilters ) {
    <ng-content></ng-content>
}

@if ( showFilters && hasAdvancedFilters && showAdvancedFilters ) {
    <ng-content select="[advanced]"></ng-content>
}

<div class="actions">
    @if ( showFilters && hasAdvancedFilters ) {
        @if ( showAdvancedFilters ) {
            <nrcl-button outline 
                label="Less Filters"
                icon="remove"
                (click)="onHideAdvancedClick()"
            ></nrcl-button>
        }
        @else {
            <nrcl-button outline 
                label="More Filters"
                icon="add"
                (click)="onShowAdvancedClick()"
            ></nrcl-button>
        }
    }

    <nrcl-device-view>
        <ng-template mobile-view>
            @if ( showFilters ) {
                <nrcl-button outline 
                    label="Hide Filters"
                    icon="expand_less"
                    (click)="onHideClick()"
                ></nrcl-button>
            }
            @else {
                <nrcl-button outline 
                    label="Show Filters"
                    icon="expand_more"
                    (click)="onShowClick()"
                ></nrcl-button>
            }
        </ng-template>
    </nrcl-device-view>

    <div class="spacer"></div>        

    @if ( showClear && showFilters ) {
        <nrcl-button outline 
            label="Clear"
            icon="clear-filters"
            (click)="onClearClick()"
        ></nrcl-button>
    }
</div>
