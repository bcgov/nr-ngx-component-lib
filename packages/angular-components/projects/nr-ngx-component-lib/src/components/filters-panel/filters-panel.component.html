
<div class="search-actions">
    <div class="search">
        <ng-content select="nrcl-filter-search"></ng-content>
        <div class="spacer"></div>
    </div>

    <nrcl-device-view>
        <ng-template desktop-view>
            @if ( showFilters && hasAdvancedFilters ) {
                @if ( showAdvancedFilters ) {
                    <nrcl-button tertiary
                        [label]="moreFiltersLabels[1]"
                        iconRight="expand_less"
                        (click)="onHideAdvancedClick()"
                    ></nrcl-button>
                }
                @else {
                    <nrcl-button tertiary
                        [label]="moreFiltersLabels[0]"
                        iconRight="expand_more"
                        (click)="onShowAdvancedClick()"
                    ></nrcl-button>
                }
            }

                @if ( showClear && showFilters ) {
                <nrcl-button secondary
                    [label]="clearLabel"
                    icon="clear-filters"
                    (click)="onClearClick()"
                ></nrcl-button>
            }
        </ng-template>
    </nrcl-device-view>
</div>

<div class="filters">
    <ng-content></ng-content>

    @if ( hasAdvancedFilters && showAdvancedFilters ) {
        <ng-content select="[advanced]"></ng-content>
    }
</div>

<div class="mobile-actions">
    <nrcl-device-view>
        <ng-template mobile-view>
            @if ( hasAdvancedFilters ) {
                @if ( showAdvancedFilters ) {
                    <nrcl-button tertiary
                        [label]="moreFiltersLabels[1]"
                        iconRight="expand_less"
                        (click)="onHideAdvancedClick()"
                    ></nrcl-button>
                }
                @else {
                    <nrcl-button tertiary
                        [label]="moreFiltersLabels[0]"
                        iconRight="expand_more"
                        (click)="onShowAdvancedClick()"
                    ></nrcl-button>
                }
            }

            @if ( showClear ) {
                <nrcl-button secondary
                    [label]="clearLabel"
                    icon="clear-filters"
                    (click)="onClearClick()"
                ></nrcl-button>
            }
        </ng-template>
    </nrcl-device-view>
</div>
