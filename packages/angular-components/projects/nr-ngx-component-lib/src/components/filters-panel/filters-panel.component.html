@if ( showFilters ) {
    <ng-content></ng-content>
}

@if ( showFilters && hasAdvancedFilters && showAdvancedFilters ) {
    <ng-content select="[advanced]"></ng-content>
}

<div class="actions">
    @if ( showFilters && hasAdvancedFilters ) {
        @if ( showAdvancedFilters ) {
            <!-- <ng-content select="[advanced]"></ng-content> -->

            <button mat-stroked-button class="hide"
                (click)="onHideAdvancedClick()"
            >
                <mat-icon>remove</mat-icon>
                Less Filters
            </button>
        }
        @else {
            <button mat-stroked-button class="show"
                (click)="onShowAdvancedClick()"
            >
                <mat-icon>add</mat-icon>
                More Filters
            </button>
        }
    }

    <nrcl-device-view>
        <ng-template mobile-view>
            @if ( showFilters ) {
                <button mat-stroked-button class="hide"
                    (click)="onHideClick()"
                >
                    <mat-icon>expand_less</mat-icon>
                    Hide Filters
                </button>
            }
            @else {
                <button mat-stroked-button class="show"
                    (click)="onShowClick()"
                >
                    <mat-icon>expand_more</mat-icon>
                    Show Filters
                </button>
            }
        </ng-template>
    </nrcl-device-view>

    <div class="spacer"></div>        

    @if ( showClear && showFilters ) {
        <button mat-stroked-button class="clear"
            (click)="onClearClick()"
        >
            <mat-icon>filter_list_off</mat-icon>
            Clear
        </button>
    }
</div>
