@if ( hasRows ) {
    <nrcl-filter-container class="summary"
        label="Showing Rows"
    >
        <span>{{ firstRow }} to {{ lastRow }} <small>(of {{ rowCount }})</small></span>
    </nrcl-filter-container>
}
@else {
    <div class="no-rows">{{ noRowsMessage }}</div>
}

@if ( hasRows ) {
    <div class="pagination">

        @if (showBoundaryLinks) {
            <a
                class="pagination-boundary pagination-first"
                [class.disabled]="pageNumber <= 1"
                [attr.aria-disabled]="pageNumber <= 1"
                [attr.tabindex]="pageNumber <= 1 ? -1 : 0"
                aria-label="First page"
                (click)="pageNumber > 1 && onPageNumberChange(1)"
                (keyup.enter)="pageNumber > 1 && onPageNumberChange(1)"
            >
            </a>
        }

        <pagination-controls
            [id]="paginationId"
            [maxSize]="paginationMaxSize"
            [responsive]="false"
            [directionLinks]="true"
            previousLabel=""
            nextLabel=""
            [autoHide]="false"
            (pageChange)="onPageNumberChange( $event )"
        ></pagination-controls>

        @if (showBoundaryLinks) {
            <a
                class="pagination-boundary pagination-last"
                [class.disabled]="pageNumber >= pageCount"
                [attr.aria-disabled]="pageNumber >= pageCount"
                [attr.tabindex]="pageNumber >= pageCount ? -1 : 0"
                aria-label="Last page"
                (click)="pageNumber < pageCount && onPageNumberChange(pageCount)"
                (keyup.enter)="pageNumber < pageCount && onPageNumberChange(pageCount)"
            >
            </a>
        }

    </div>
}

@if ( hasRows && showPageSize ) {
    <nrcl-filter-select class="page-size"
        label="Page Size"
        [value]="[ pageSize ]"
        [options]="pageSizeOptions"
        (valueChange)="onPageSizeChange( $event[ 0 ] )"
        selectMax="1"
        [clear]="false"
        [filter]="false"
        placeholder="Select..."
    ></nrcl-filter-select>
}
