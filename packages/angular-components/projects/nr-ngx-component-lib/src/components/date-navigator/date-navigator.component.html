<nrcl-button tertiary
    label="Today"
    icon="event"
    (click)="onDateNav( 0 )"
></nrcl-button>

@if ( largeChange ) {
    <nrcl-button tertiary
        icon="keyboard_double_arrow_left"
        (click)="onDateNav( -1 * largeChange )"
    ></nrcl-button>
}

@if ( smallChange ) {
    <nrcl-button tertiary
        icon="keyboard_arrow_left"
        (click)="onDateNav( -1 * smallChange )"
    ></nrcl-button>
}

<mat-form-field
    floatLabel="auto"
    appearance="fill"
    subscriptSizing="dynamic"
>
    <input matInput #input
        [matDatepicker]="picker"
        (focus)="onInputFocus( $event )"
        [ngModel]="date" 
        (ngModelChange)="onDateChange( $event )"
    >

    <mat-datepicker #picker></mat-datepicker>
</mat-form-field>

@if ( smallChange ) {
    <nrcl-button tertiary
        icon="keyboard_arrow_right"
        (click)="onDateNav( smallChange )"
    ></nrcl-button>
}

@if ( largeChange ) {
    <nrcl-button tertiary
        icon="keyboard_double_arrow_right"
        (click)="onDateNav( largeChange )"
    ></nrcl-button>
}
