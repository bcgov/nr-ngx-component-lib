<nrcl-button tertiary
    label="Today"
    icon="event"
    (click)="onDateNav( 0 )"
></nrcl-button>

@if ( largeChange ) {
    <nrcl-button tertiary
        icon="keyboard_double_arrow_left"
        (click)="onDateNav( -1 * largeChange )"
    ></nrcl-button>
}

@if ( smallChange ) {
    <nrcl-button tertiary
        icon="keyboard_arrow_left"
        (click)="onDateNav( -1 * smallChange )"
    ></nrcl-button>
}

<mat-form-field
    floatLabel="auto"
    appearance="outline"
    subscriptSizing="dynamic"
>
    <!-- <mat-label>{{ label }}</mat-label> -->

    <input matInput #input
        [matDatepicker]="picker"
        (focus)="onInputFocus()"
        [ngModel]="date" 
        (ngModelChange)="onDateChange( $event )"
    >

    <!-- <mat-hint>MM/DD/YYYY</mat-hint> -->

    <mat-datepicker #picker></mat-datepicker>

    <nrcl-button tertiary matSuffix
        [icon]="picker.opened ? 'arrow_drop_up' : 'arrow_drop_down'"
        (click)="picker.open()"
    ></nrcl-button> 
</mat-form-field>

@if ( smallChange ) {
    <nrcl-button tertiary
        icon="keyboard_arrow_right"
        (click)="onDateNav( smallChange )"
    ></nrcl-button>
}

@if ( largeChange ) {
    <nrcl-button tertiary
        icon="keyboard_double_arrow_right"
        (click)="onDateNav( largeChange )"
    ></nrcl-button>
}
