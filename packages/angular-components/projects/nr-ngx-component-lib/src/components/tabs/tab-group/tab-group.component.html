<!-- my-tab-group.component.html -->
<mat-tab-group 
    mat-stretch-tabs="false"
    animationDuration="0ms" 
    disableRipple="true"
>    
  <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
    <!-- Render the projected template using ngTemplateOutlet -->
    <!-- <ng-container *ngTemplateOutlet="tab.content"></ng-container> -->

    @if ( tab.labelTemplate ) {
        <ng-template mat-tab-label>
            <ng-container *ngTemplateOutlet="tab.labelTemplate.template"></ng-container>
        </ng-template>
    }

    <!-- Lazy Loaded Body -->
    <ng-template matTabContent>
        <ng-container *ngTemplateOutlet="tab.content"></ng-container>
    </ng-template>    
  </mat-tab>
</mat-tab-group>

<!-- Hidden slot to keep the MyTabComponents in the DOM for ContentChildren to find -->
<div style="display: none;"><ng-content></ng-content></div>
